# Golden set для оценки качества RAG-поиска по конспектам курса Зерокодера.
#
# answerable: true  -> в lessons перечислены уроки, где ответ действительно есть
#                      (проверено чтением файла, раздел указан в note)
# answerable: false -> lessons пустой, обязателен kind:
#                      out_of_domain    — вопрос вообще не про курс
#                      in_domain_absent — тема смежная и правдоподобная,
#                                         но в конспектах её нет (проверено grep)

version: 1
questions:

  # ---------------------------------------------------------------
  # Модуль 0. Вводно-правовой
  # ---------------------------------------------------------------

  - id: q001
    question: "Сколько домашек надо сдать, чтобы получить не просто бумажку слушателя, а полноценный сертификат?"
    lessons: ["PEW01"]
    answerable: true
    note: "раздел «5. Условия для получения сертификата» — таблица трёх типов сертификатов: 80% уроков / 30% ДЗ / 70% ДЗ плюс итоговый проект"

  - id: q002
    question: "Что грозит, если я как самозанятый неправильно обращаюсь с данными клиентов?"
    lessons: ["PEW03"]
    answerable: true
    note: "раздел «2. 152-ФЗ простым языком» → «Что будет, если не соблюдать»: ст. 13.11 КоАП, штрафы 3 000–75 000 ₽, до 150 000 ₽ при утечке, блокировка, проверка Роскомнадзора"

  - id: q003
    question: "У нас есть клиенты из Евросоюза. Какие дополнительные правила придётся соблюдать и чем рискуем?"
    lessons: ["PEW02"]
    answerable: true
    note: "раздел «4. Юридические требования» → «Европейский регламент GDPR»: требования к согласию строже, штрафы до 20 млн евро или 4% годового оборота"

  - id: q004
    question: "Можно ли скинуть в чат нейросети внутренний документ компании, чтобы она его пересказала?"
    lessons: ["PEW02"]
    answerable: true
    note: "раздел «2. Что такое персональные данные» → «Категория №2: коммерческая тайна и внутренние документы»"

  # ---------------------------------------------------------------
  # Модуль 1. Основы промпт-инжиниринга
  # ---------------------------------------------------------------

  - id: q005
    question: "Чем обычный набор чисел отличается от того, который кодирует смысл слова?"
    lessons: ["PEb03"]
    answerable: true
    note: "раздел «2. Принцип работы LLM» → «Векторы и эмбеддинги»: вектор — просто список чисел, эмбеддинг — «умный» вектор, кодирующий смысл; пример «король» / «царь» / «собака»"

  - id: q006
    question: "Через какие стадии проходит языковая модель, прежде чем начнёт нормально отвечать людям?"
    lessons: ["PEb03"]
    answerable: true
    note: "раздел «9. Обучение LLM»: Pre-train → Fine-tuning → RLHF, с итоговой таблицей «что даёт каждый этап»"

  - id: q007
    question: "Какое значение обычно ставят у параметра, который отсекает слова по суммарной вероятности?"
    lessons: ["PEb05"]
    answerable: true
    note: "раздел «10. Настройки LLM» → «Top-p (Nucleus Sampling)»: «на практике самое часто используемое значение — 0.9»"

  - id: q008
    question: "Если ужать модель, чтобы она влезла в домашний компьютер, сильно ли пострадает качество ответов?"
    lessons: ["PEb05"]
    answerable: true
    note: "раздел «10. Настройки LLM» → «Квантованные модели»: сжатие до 4 бит уменьшает размер примерно вчетверо, сохраняется 97–98% качества"

  - id: q009
    question: "Как между собой соотносятся искусственный интеллект, машинное обучение, нейросети и языковые модели — что внутри чего?"
    lessons: ["PEb02"]
    answerable: true
    note: "раздел «5. Сферы применения ИИ» → «Слоёный пирог: иерархия понятий»: пять слоёв от AI до LLM"

  - id: q010
    question: "Есть ли простой каркас, чтобы в запросе не забыть ни роль, ни задачу, ни контекст, ни требования к ответу?"
    lessons: ["PEb06"]
    answerable: true
    note: "раздел «5. Шаблоны для создания промптов» → «Шаблон RACE: роль, действие, контекст, ожидания» (там же CO-STAR и RISEN)"

  # ---------------------------------------------------------------
  # Модуль 2. Стратегии и техники промпт-инжиниринга
  # ---------------------------------------------------------------

  - id: q011
    question: "Как заставить одну нейросеть беспристрастно оценить ответы другой, и по какой шкале она ставит баллы?"
    lessons: ["PEs01"]
    answerable: true
    note: "раздел «2. LLM-судья» → «Критерии оценки»: пять критериев по 0–4 балла, максимум 20; там же готовый промпт судьи"

  - id: q012
    question: "Куда в запросе лучше положить неизменную часть, чтобы платить провайдеру меньше?"
    lessons: ["PEs03"]
    answerable: true
    note: "раздел «2. Восемь стратегий оптимизации» → «Стратегия № 2: кэширование промптов»: статика в начало, динамика в конец, скидка 75–90% на входные токены"

  - id: q013
    question: "Надо обработать десять тысяч текстов, срочности нет. Можно ли сэкономить?"
    lessons: ["PEs03"]
    answerable: true
    note: "раздел «2. Восемь стратегий оптимизации» → «Стратегия № 3: Batch API»: минус 50% стоимости, гарантированный срок 24 часа, не подходит для чат-ботов"

  - id: q014
    question: "Когда обращаешься к модели программно, там есть какие-то роли у сообщений. Что они означают?"
    lessons: ["PEs04"]
    answerable: true
    note: "раздел «2. Структура API-запроса» → «Роли в API-запросе»: System — правило, User — задача, Assistant — память"

  - id: q015
    question: "Почему у Сбера нельзя просто вставить один ключ и работать, как у OpenAI?"
    lessons: ["PEs05"]
    answerable: true
    note: "раздел «2. Авторизация: чем российские модели отличаются от OpenAI» → таблица схем: ГигаЧат — двухэтапная, временный токен живёт 30 минут и требует автообновления"

  - id: q016
    question: "Чем агент, который сам разбивает задачу на подзадачи и сам запускает код, отличается от редактора с ИИ-подсказками?"
    lessons: ["PEs06.1"]
    answerable: true
    note: "раздел «2. Главное отличие Cloud Code от Cursor» + итоговая сравнительная таблица (разбивка задач, системные команды, запуск кода)"

  # ---------------------------------------------------------------
  # Модуль 3. No-Code и API интеграции
  # ---------------------------------------------------------------

  - id: q017
    question: "По каким признакам понять, что передо мной настоящий агент, а не просто чат-бот с промптом?"
    lessons: ["PEn01"]
    answerable: true
    note: "раздел «3. Что такое ИИ-агент?» → «Определение»: три признака — оркестратор с инструментами, декомпозиция задач, автономность"

  - id: q018
    question: "В чём разница между тем, что я сам дёргаю сервис, и тем, что сервис сам мне сообщает о событии?"
    lessons: ["PEn02"]
    answerable: true
    note: "раздел «2. Что такое HTTP» → «API и Webhook: в чём разница»: активное взаимодействие против пассивного уведомления, аналогия с курьером"

  - id: q019
    question: "Как в сценарии подставить в поле значение, которое пришло с предыдущего шага?"
    lessons: ["PEn03"]
    answerable: true
    note: "раздел «2. Item, JSON и Expression» → «Expression — динамические подстановки»: двойные фигурные скобки, {{ $json.task }}, внутри работает JavaScript"

  - id: q020
    question: "У меня сценарий разветвился на две параллельные ветки. Как потом свести их обратно в один поток?"
    lessons: ["PEn04"]
    answerable: true
    note: "раздел «2. Нода Merge: объединение параллельных потоков»: режимы Append, Combine, Combine by Position, All Possible Combinations, Choose Branch"

  - id: q021
    question: "Какой мощности сервер нужен, чтобы поднять автоматизацию у себя, а не гонять её на ноутбуке?"
    lessons: ["PEn06"]
    answerable: true
    note: "раздел «2. Выбор хостинга и создание виртуальной машины в Timeweb»: таблица системных требований — минимум 1 ядро / 2 ГБ RAM / 20 ГБ SSD, для мощных проектов 2+ ядра / 4+ ГБ / 40+ ГБ"

  - id: q022
    question: "Хочу, чтобы бот складывал задачи не в таблицу, а во внешний таск-трекер. Как их подружить?"
    lessons: ["PEn09"]
    answerable: true
    note: "раздел «Часть 5. Интеграция ClickUp» → «Подключение ClickUp к n8n через OAuth2»: Create an App, Redirect URL, Client ID и Client Secret"

  - id: q023
    question: "Можно ли складывать данные российских пользователей в Google Таблицы, раз это удобно?"
    lessons: ["PEnB10"]
    answerable: true
    note: "раздел «2. Хранение данных и резервные копии» → «Где хранить данные»: зарубежные сервисы использовать нельзя, российские варианты — Yandex Cloud, Timeweb Cloud, Selectel"

  # ---------------------------------------------------------------
  # Модуль 4. Мультимодальные модели и расширенные форматы генерации
  # ---------------------------------------------------------------

  - id: q024
    question: "Надо разбирать сканы договоров с таблицами. Какая модель с этим справляется лучше остальных?"
    lessons: ["PEm01"]
    answerable: true
    note: "раздел «4. Какую модель выбрать под задачу» → «Claude Sonnet 4 / Opus 4»: лидер по документам, сканам и многоуровневым структурам"

  - id: q025
    question: "Почему нейросеть путается, если документ сфотографировали криво или в полумраке?"
    lessons: ["PEm02"]
    answerable: true
    note: "раздел «1. Как модель «видит» изображение» → «Главный риск — некачественные исходники»: размытое фото даёт искажённые векторы, ошибка приходит без явного сбоя"

  - id: q026
    question: "Какой сервис лучше всех расшифровывает русскую речь в текст?"
    lessons: ["PEm03"]
    answerable: true
    note: "раздел «2. Сравнение платформ TTS/STT»: Yandex SpeechKit — лидер STT на русском; Eleven Labs недоступен из РФ, Whisper — золотой стандарт по универсальности"

  - id: q027
    question: "Что вообще считается минимально жизнеспособным продуктом и когда его уже можно показывать людям?"
    lessons: ["PEm05"]
    answerable: true
    note: "раздел «1. Понятие MVP. Цели ассистента»: определение MVP — версия с ключевым функционалом, ещё с багами, но уже решающая основную задачу"

  - id: q028
    question: "Как из питоновского проекта сделать обычную программу с ярлыком, чтобы отдать её человеку без терминала?"
    lessons: ["PEm08"]
    answerable: true
    note: "раздел «6. Сборка desktop-приложения» → «Сборка desktop-приложения с помощью PyQt6»: build.py, pyinstaller, готовый .exe в папке dist/"

  - id: q029
    question: "В чём практическая разница между классическим программистом, ноукодером и тем, кто пишет код вместе с ИИ?"
    lessons: ["PEmB01.2"]
    answerable: true
    note: "раздел «2. Три подхода: Code vs VibeCode vs NoCode» и «Развёрнутый пример» со сроками 1,5–2 месяца / 2 дня / около недели"

  # ---------------------------------------------------------------
  # Модуль 5. Ассистенты с памятью, RAG и Relevance
  # ---------------------------------------------------------------

  - id: q030
    question: "На куски какого размера резать документы для базы знаний и нужно ли, чтобы они частично накладывались друг на друга?"
    lessons: ["PEr03", "PEr08"]
    answerable: true
    note: "PEr03, раздел «8. Пайплайн подготовки данных: чанкинг» (300–500 токенов для FAQ, 500–800 для документации, перекрытие 10–20%) и PEr08, раздел «5. Типовые ошибки RAG» (стандарт 128–512 токенов, оверлап 15–20%)"

  - id: q031
    question: "Сколько найденных фрагментов имеет смысл отдавать модели на один вопрос?"
    lessons: ["PEr08"]
    answerable: true
    note: "раздел «4. Параметры RAG» → «Количество извлекаемых чанков (top_k)»: отправное значение 3–5, меньше при больших чанках, подбирается экспериментально"

  - id: q032
    question: "Опиши по шагам, что происходит с вопросом пользователя, пока система ищет ответ в документах."
    lessons: ["PEr01"]
    answerable: true
    note: "раздел «3. Архитектура RAG» → «Как выглядит RAG изнутри»: восемь шагов от эмбеддинга запроса и поиска в хранилище до фильтрации, реренкинга и генерации"

  - id: q033
    question: "Данные под NDA, в облако их отдавать нельзя. Какое хранилище векторов тогда брать?"
    lessons: ["PEr02"]
    answerable: true
    note: "разделы «4. Weaviate» (open-source, локальная установка, приватные данные и NDA) и «6. Выбор инструмента: основные критерии» — против облачного Pinecone"

  - id: q034
    question: "Сколько последних сообщений диалога вообще стоит держать в контексте, чтобы бот не тупил и не разорял?"
    lessons: ["PEr04"]
    answerable: true
    note: "раздел «2. Виды памяти в AI-ассистентах: краткосрочная»: как правило около 10 последних пар «вопрос-ответ», при необходимости 15–20"

  - id: q035
    question: "Можно ли собрать помощника по своим документам вообще без кода и повесить его виджетом на сайт?"
    lessons: ["PEr05"]
    answerable: true
    note: "раздел «3. Создаём первого NoCode-ассистента в Chatbase»: загрузка файлов, Train & Continue, вкладка Deploy и код чат-виджета перед </body>"

  - id: q036
    question: "Чем автоматически померить, что ассистент отвечает по документам, а не сочиняет?"
    lessons: ["PEr06"]
    answerable: true
    note: "раздел «5. RAGAS»: три метрики — faithfulness (проверка на галлюцинации), context relevance, answer relevance"

  - id: q037
    question: "Что именно можно держать в быстрой памяти, чтобы система не пересчитывала одно и то же на каждый частый вопрос?"
    lessons: ["PEr07"]
    answerable: true
    note: "раздел «3. Кеширование» → «Применение кэширования в RAG-системе»: три уровня — кэш эмбеддингов запросов, кэш результатов ретривела, кэш финальных ответов"

  - id: q038
    question: "У меня при запуске оценки падает импорт библиотеки метрик с ошибкой про vertexai. Что с этим делать?"
    lessons: ["PEr06"]
    answerable: true
    note: "блок «⚠️ Актуализация» в конце раздела «6. Практический пример: тестирование RAG-системы с RAGAS»: RAGAS 0.4.3 ломает импорт, рабочая связка — ragas==0.1.21 и langchain-community==0.2.17"

  - id: q039
    question: "В домашке просят поменять число извлекаемых фрагментов через файл настроек — это точно сработает?"
    lessons: ["PEr07"]
    answerable: true
    note: "блок «⚠️ Актуализация» перед разделом «Знакомство с основными модулями проекта»: из .env реально читается только OPENAI_API_KEY, top_k зашит в main.py и rag.py, правку надо делать в коде"

  # ---------------------------------------------------------------
  # Бонусный модуль
  # ---------------------------------------------------------------

  - id: q040
    question: "Есть платформа, которая позволяет пользоваться зарубежной моделью и при этом не нарушать закон о персональных данных. Как она это делает?"
    lessons: ["SMPb01"]
    answerable: true
    note: "раздел «2. Платформа SMAIPL» → «Анонимайзер и 152-ФЗ»: ПДн остаются на российских серверах, в LLM уходит очищенный запрос, ответ восстанавливается"

