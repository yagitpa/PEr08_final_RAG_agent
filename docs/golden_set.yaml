    answerable: false
    kind: in_domain_absent
    note: "grep -ri lora — 0 совпадений; fine-tuning упоминается в PEb03 и PEs03 только на уровне идеи, без методов адаптеров"

  - id: q046
    question: "Как в CrewAI раздать роли нескольким агентам и заставить их передавать задачи друг другу?"
    lessons: []
    answerable: false
    kind: in_domain_absent
    note: "grep -ri crewai и grep -ri autogen — 0 совпадений; мультиагентные системы названы в PEn01 лишь как тип агентов, конкретных фреймворков нет"

  - id: q047
    question: "Как задеплоить сценарии в Kubernetes и настроить автомасштабирование под нагрузку?"
    lessons: []
    answerable: false
    kind: in_domain_absent
    note: "grep -ri kubernetes — 0 совпадений; развёртывание в PEn06 идёт только через Docker, Portainer и виртуальную машину Timeweb"

  - id: q048
    question: "По какому бенчмарку — вроде MTEB — выбирать модель эмбеддингов для русского языка?"
    lessons: []
    answerable: false
    kind: in_domain_absent
    note: "grep -ri mteb — 0 совпадений; про бенчмарки в PEb04 говорится только применительно к чат-моделям и аренам, для эмбеддингов сравнений нет"

